<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare Web 爬虫 - 在线爬虫操作界面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      header h1 {
        font-size: 1.8rem;
      }
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .panel-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
      font-size: 0.95rem;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      font-family: 'Monaco', 'Menlo', monospace;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      grid-column: 1 / -1;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      border: 2px solid #e0e0e0;
    }

    .btn-secondary:hover {
      background: #efefef;
    }

    .btn-export {
      background: #4CAF50;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .btn-export:hover {
      background: #45a049;
    }

    .btn-copy {
      background: #2196F3;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .btn-copy:hover {
      background: #0b7dda;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.85rem;
      background: #f5f5f5;
      color: #666;
      border: 1px solid #ddd;
      width: auto;
    }

    .btn-small:hover {
      background: #efefef;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-section {
      grid-column: 1 / -1;
    }

    .result-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 2px solid #e0e0e0;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 15px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-weight: 500;
      color: #999;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .result-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .result-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-box {
      background: #f8f8f8;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      max-height: 500px;
      overflow-y: auto;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .stat-label {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .error-message {
      background: #fee;
      border: 1px solid #fcc;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: #efe;
      border: 1px solid #cfc;
      color: #3c3;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .tooltip {
      font-size: 0.8rem;
      color: #999;
      margin-top: 5px;
    }

    .icon {
      display: inline-block;
      font-size: 1.2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 0.9rem;
    }

    table thead {
      background: #f5f5f5;
    }

    table th, table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    table th {
      font-weight: 600;
      color: #333;
    }

    table tr:hover {
      background: #fafafa;
    }

    .history-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #e0e0e0;
    }

    .history-item {
      padding: 10px;
      background: #f9f9f9;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:hover {
      background: #f0f0f0;
    }

    .history-item-info {
      flex: 1;
    }

    .history-item-url {
      font-weight: 500;
      color: #667eea;
      word-break: break-all;
    }

    .history-item-time {
      font-size: 0.8rem;
      color: #999;
      margin-top: 4px;
    }

    .history-empty {
      padding: 20px;
      text-align: center;
      color: #999;
    }

    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .stat-mini {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
    }

    .stat-mini .stat-value {
      font-size: 1.4rem;
    }

    .stat-mini .stat-label {
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🕷️ Cloudflare Web 爬虫</h1>
      <p>在线爬虫操作界面 - 支持 Pages 和 Workers 部署</p>
    </header>

    <div class="main-grid">
      <!-- 输入面板 -->
      <div class="panel">
        <div class="panel-title">
          <span class="icon">⚙️</span>
          爬虫配置
        </div>

        <div class="error-message" id="errorMsg"></div>
        <div class="success-message" id="successMsg"></div>

        <div class="form-group">
          <label for="targetUrl">目标 URL *</label>
          <input
            type="url"
            id="targetUrl"
            placeholder="https://example.com"
            value="https://news.ycombinator.com"
          >
          <div class="tooltip">输入要爬取的网页链接</div>
        </div>

        <div class="form-group">
          <label for="selector">CSS 选择器 *</label>
          <textarea
            id="selector"
            placeholder=".story-title&#10;.score"
          >.story-title a</textarea>
          <div class="tooltip">多个选择器用换行符分隔，使用 CSS 选择器语法</div>
        </div>

        <div class="form-group">
          <label for="extractMethod">提取方法</label>
          <select id="extractMethod">
            <option value="text">文本内容 (text)</option>
            <option value="html">HTML 源码 (html)</option>
            <option value="attr">属性值 (href/src/...)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="attrName">属性名称 (提取方法为属性时)</label>
          <input
            type="text"
            id="attrName"
            placeholder="href, src, title..."
            value="href"
          >
        </div>

        <div class="form-group">
          <label for="timeout">请求超时 (秒)</label>
          <input
            type="number"
            id="timeout"
            min="5"
            max="120"
            value="30"
          >
        </div>

        <div class="button-group">
          <button class="btn-primary" id="scrapeBtn" onclick="window.startScrape()">
            <span class="icon">▶️</span>
            开始爬虫
          </button>
          <button class="btn-secondary" onclick="window.clearForm()">
            <span class="icon">🔄</span>
            重置
          </button>
        </div>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p>正在爬虫中...</p>
        </div>

        <!-- 历史记录 -->
        <div class="history-section">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="font-size: 1rem; color: #666;">📚 爬虫历史</h3>
            <button class="btn-small" onclick="window.clearHistory()">清空历史</button>
          </div>
          <div id="historyList" class="history-empty">暂无历史记录</div>
        </div>
      </div>

      <!-- 结果面板 -->
      <div class="panel result-section">
        <div class="panel-title">
          <span class="icon">📊</span>
          爬虫结果
        </div>

        <div class="stats">
          <div class="stat-card">
            <div class="stat-value" id="itemCount">0</div>
            <div class="stat-label">数据项数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="costTime">0s</div>
            <div class="stat-label">耗时</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statusCode">-</div>
            <div class="stat-label">状态码</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="cacheStatus">-</div>
            <div class="stat-label">缓存状态</div>
          </div>
        </div>

        <!-- 分析统计 -->
        <div id="analyticsStats"></div>

        <div class="result-tabs">
          <button class="tab-btn active" onclick="window.switchTab('json')">JSON</button>
          <button class="tab-btn" onclick="window.switchTab('table')">表格</button>
          <button class="tab-btn" onclick="window.switchTab('raw')">原始HTML</button>
        </div>

        <div id="json" class="result-content active">
          <div class="result-box" id="jsonResult">等待爬虫结果...</div>
          <button class="btn-copy" onclick="window.copyToClipboard('jsonResult')">📋 复制 JSON</button>
          <button class="btn-export" onclick="window.exportData('json')">📥 导出 JSON</button>
        </div>

        <div id="table" class="result-content">
          <div id="tableResult" style="overflow-x: auto;">等待爬虫结果...</div>
          <button class="btn-export" onclick="window.exportData('csv')">📥 导出 CSV</button>
        </div>

        <div id="raw" class="result-content">
          <div class="result-box" id="rawResult">等待爬虫结果...</div>
          <button class="btn-copy" onclick="window.copyToClipboard('rawResult')">📋 复制 HTML</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
